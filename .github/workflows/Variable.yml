
# This is a basic workflow to help you get started with Actions

name: Variable Practise

# Controls when the workflow will run
on:
  # Triggers on push or pull request events for the main branch
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # Allows manual execution from the Actions tab
  workflow_dispatch:

jobs:
  build:
    # Runner configuration
    runs-on: ubuntu-latest

    # Environment variables available to all steps in this job
    env:
      mascot: Mona
      super_duper_var: totally_awesome

    steps:
      # Checks out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Prints the mascot variable
      - name: Print mascot
        run: echo "Hi ${{ env.mascot }}"

      # Prints the second variable
      - name: Print super duper variable
        run: echo "Hi ${{ env.super_duper_var }}"
